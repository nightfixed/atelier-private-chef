name: Deploy Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Check for unsafe .focus() calls in static HTML
        run: |
          if grep -rn '\.focus()' web/public --include="*.html"; then
            echo "::error::.focus() fara { preventScroll: true } gasit in HTML static — vezi /memories/repo/workflow.md"
            exit 1
          fi
          echo "OK: niciun .focus() nesigur in HTML static"

      - name: Build Next.js static export
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}

      - name: Inject API_URL into oglinda HTML
        run: |
          sed -i "s|__API_URL__|${{ vars.API_URL }}|g" web/out/oglinda.html
          echo "Injected API_URL into web/out/oglinda.html"
          grep "API_URL" web/out/oglinda.html | head -1

      - name: Inject API_URL into asezat HTML
        run: |
          sed -i "s|__API_URL__|${{ vars.API_URL }}|g" web/out/asezat/index.html
          echo "Injected API_URL into web/out/asezat/index.html"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy web/out --project-name=atelier-private-chef --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
